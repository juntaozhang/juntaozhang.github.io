#      - "10."
#      - "172.16."
#    regex:
#      internal_ip: "\\b(?:192\\.168\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)|10\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)|10\\.0\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)|172\\.(?:1[6-9]|2\\d|3[01])\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?)\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]\\d?))(?::\\d+)?\\b"

  - name: HardcodedExamplePassword
    keywords:
      - "password"
      - "passwd"
      - "secret"
      - "secret_key"
    regex:
      password: "(?i)(?:password|passwd|secret|secret_key)[ \\t]*[=:][ \\t]*[\"']?([^\\s\"'>$][a-z0-9!@#$%^&*]{5,})[\"']?"
    exclude_words:
      - "CHANGEME"
      - "changeme"
      - "your-password"
      - "example"
      - "$.+"
      - "existingSecret"
